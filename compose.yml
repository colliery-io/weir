# weir stack — one Postgres, two profiles ([[WEIR-T-0173]]).
#
#   Demo (weir + Postgres ONLY):            docker compose --profile demo up --build
#                                           (or: angreal docker up)  → http://localhost:8080
#   Integration estate (pg/mssql/dex/minio): docker compose --profile integration up -d --wait
#                                           (or: angreal integration up/test)
#
# Postgres is the single SoR and stays unprofiled (both paths need it; a bare `up`
# starts only Postgres). The test-only services (MSSQL + seed, Dex, MinIO + seed)
# carry the `integration` profile so the demo never pulls the ~1.5GB SQL Server
# image. Explicitly targeting a profiled service still works without the flag
# (compose activates its profile), so `docker compose up -d dex` is fine.
#
# Host ports are overridable to coexist with local services (weir's is the only
# non-loopback publish): WEIR_HTTP_HOST_PORT (8080), WEIR_PG_HOST_PORT (5432),
# WEIR_MSSQL_HOST_PORT (1433), WEIR_MINIO_HOST_PORT (9000), WEIR_MYSQL_HOST_PORT (3306),
# WEIR_PG_TLS_HOST_PORT (5434), WEIR_MSSQL_TLS_HOST_PORT (11433).
# Postgres is NOT exposed to the network; the weir service reaches it over the
# compose network at `postgres:5432` (never localhost).
name: weir

services:
  postgres:
    image: postgres:16
    # wal_level=logical enables logical replication slots for CDC (WEIR-T-0028).
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: weir
      POSTGRES_PASSWORD: weir
      POSTGRES_DB: weir
    ports:
      # Loopback-only, and the host port is overridable (WEIR_PG_HOST_PORT) so the stack can
      # coexist with another Postgres already on 5432. In-compose services still use `postgres:5432`;
      # only the host-run integration tests need this mapping (set WEIR_TEST_PG_URL to match).
      - "127.0.0.1:${WEIR_PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weir -d weir"]
      interval: 2s
      timeout: 3s
      retries: 15

  # TLS-ONLY Postgres — the [[WEIR-A-0041]] wire-proof gate ([[WEIR-T-0178]]):
  # ssl=on with a hostssl-only pg_hba, so a PLAINTEXT connection is REJECTED and a
  # passing sync proves TLS engaged. Certs are ephemeral — run
  # `scripts/gen-test-tls.sh` first (angreal integration up does). The entrypoint
  # wrapper copies the mounted material so the key gets postgres-owned 0600 perms
  # regardless of host uid (bind mounts arrive with arbitrary ownership).
  postgres-tls:
    profiles: ["integration"]
    image: postgres:16
    environment:
      POSTGRES_USER: weir
      POSTGRES_PASSWORD: weir
      POSTGRES_DB: weir
    volumes:
      - ./target/weir-tls-certs:/certs-src:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        mkdir -p /certs && cp /certs-src/server.crt /certs-src/server.key /certs-src/pg_hba.conf /certs/ &&
        chown -R postgres:postgres /certs && chmod 600 /certs/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt
        -c ssl_key_file=/certs/server.key -c hba_file=/certs/pg_hba.conf -c wal_level=logical
    ports:
      - "127.0.0.1:${WEIR_PG_TLS_HOST_PORT:-5434}:5432"
    healthcheck:
      # Unix-socket check (`local … trust` in the hba) — TCP is hostssl-only.
      test: ["CMD-SHELL", "pg_isready -U weir -d weir"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Force-Encryption SQL Server — [[WEIR-T-0177]]'s wire gate. Same ephemeral cert
  # material; mssql.conf sets forceencryption=1. The healthcheck connects with
  # -N (encrypt) -C (trust the test cert).
  mssql-tls:
    profiles: ["integration"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "weirStrong!Pass1"
      MSSQL_PID: "Developer"
    volumes:
      - ./target/weir-tls-certs:/certs-src:ro
    # Root ONLY for the cert staging (bind mounts arrive with arbitrary host
    # ownership); permissions_check.sh is the image's own drop-to-mssql wrapper.
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - >
        mkdir -p /var/opt/mssql/certs &&
        cp /certs-src/server.crt /certs-src/server.key /var/opt/mssql/certs/ &&
        sed 's#/certs/#/var/opt/mssql/certs/#' /certs-src/mssql.conf > /var/opt/mssql/mssql.conf &&
        chown -R mssql /var/opt/mssql && chmod 600 /var/opt/mssql/certs/server.key &&
        exec /opt/mssql/bin/sqlservr
    ports:
      - "127.0.0.1:${WEIR_MSSQL_TLS_HOST_PORT:-11433}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -N -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 30

  # Seed the Force-Encryption server with the same demo database (encrypted client).
  mssql-tls-seed:
    profiles: ["integration"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql-tls:
        condition: service_healthy
    volumes:
      - ./test-fixtures/mssql:/fixtures:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S mssql-tls -U sa -P "weirStrong!Pass1" -N -C -b -i /fixtures/seed.sql &&
        echo "seeded weir_demo (tls)"

  # SQL Server — the source for the `mssql` connector's integration test
  # ([[WEIR-T-0161]]). Loopback-only; host port overridable to coexist. Test-only;
  # plaintext login (Force Encryption off by default) is the pre-authorized demo path.
  mssql:
    profiles: ["integration"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "weirStrong!Pass1"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:${WEIR_MSSQL_HOST_PORT:-1433}:1433"
    healthcheck:
      # `-C` trusts the self-signed cert; the demo DB is seeded by the mssql-seed job.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 30

  # Seed the demo database + table the integration test reads, then exit.
  mssql-seed:
    profiles: ["integration"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./test-fixtures/mssql:/fixtures:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "weirStrong!Pass1" -C -b -i /fixtures/seed.sql &&
        echo "seeded weir_demo"

  # MySQL — a server-speaks-first wire target for the TCP egress-policy probe
  # ([[WEIR-T-0175]] hostname-carrying egress; `wasm_tcp_probe_engine.rs`). No
  # weir MySQL connector exists yet ([[WEIR-I-0043]] post-alpha) — the probe only
  # reads the unsolicited handshake greeting. Loopback-only; port overridable.
  mysql:
    profiles: ["integration"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "weir"
    ports:
      - "127.0.0.1:${WEIR_MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pweir || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Dex — OIDC provider for the auth integration/e2e ([[WEIR-T-0088]]). Test-only.
  dex:
    profiles: ["integration"]
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5557:5557"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:5557/dex/.well-known/openid-configuration
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO — an S3-compatible object store for the `s3` connector's integration test
  # ([[WEIR-T-0109]]). Loopback-only; host port overridable to coexist. Test-only.
  minio:
    profiles: ["integration"]
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${WEIR_MINIO_HOST_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Seed the `weir-test` bucket with the NDJSON fixtures, then exit.
  minio-seed:
    profiles: ["integration"]
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./test-fixtures/s3:/fixtures:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/weir-test &&
        mc cp /fixtures/events.ndjson local/weir-test/events.ndjson &&
        mc cp /fixtures/more.ndjson local/weir-test/more.ndjson &&
        echo "seeded weir-test"

  weir:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    image: weir:demo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres is the SoR; weir connects via libpq over the compose network.
      WEIR_DB: "postgres://weir:weir@postgres:5432/weir"
    ports:
      # Overridable so the demo can coexist with another service on 8080.
      - "${WEIR_HTTP_HOST_PORT:-8080}:8080"
