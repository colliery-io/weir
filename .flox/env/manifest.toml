version = 1

[install]
rustup.pkg-path = "rustup"
mdbook.pkg-path = "mdbook"
maturin.pkg-path = "maturin"
nodejs.pkg-path = "nodejs_22"

[hook]
on-activate = '''
  rustup toolchain install 1.93 2>/dev/null
  rustup default 1.93 2>/dev/null
  if ! command -v plissken &>/dev/null; then
    echo "Installing plissken..."
    cargo install plissken --version 0.2.0 --locked 2>/dev/null
  fi
'''

[profile]

[services]

[options]
