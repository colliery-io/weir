[workspace]
members = ["crates/*"]
# `crates/connectors/*` are wasm32-wasip2 guest crates (their own standalone
# workspaces, built for the wasm target + published to crates.io independently) —
# not host-workspace members. Exclude the parent so `crates/*` doesn't claim it.
exclude = ["bindings/*", "crates/connectors"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["Dylan Storey <contact@colliery.io>"]
repository = "https://github.com/colliery-io/weir"
description = "An early-stage Rust project."

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
# LTO is disabled: the reference connectors are `crate-type = ["rlib", "cdylib"]`
# (the dylib-load path, WEIR-A-0002), and LTO can't load a cdylib's bitcode into
# the `weir` bin ("failed to load bitcode"). Revisit if dylib packaging changes.
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
