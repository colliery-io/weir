# Builds the docs in docs/ (Astro Starlight with the Colliery theme
# starlight-aurora) on each pull request that changes them, and publishes them
# to the GitHub Pages of this repository on a push to main. The API reference
# is rendered by plissken from the code (plissken.toml) before the build.
#
# One-time setup: Settings → Pages → Source = "GitHub Actions". Until then the
# publish job fails. The site address is written here, not read from
# configure-pages, so the build does not need Pages to be on.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "plissken.toml"
      - "crates/*/src/**"
      - "bindings/weir-py/python/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "plissken.toml"
      - "crates/*/src/**"
      - "bindings/weir-py/python/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PLISSKEN_VERSION: "0.2.0"
  PLISSKEN_SHA256: "2166e15d69bd891959704a0f70c60724ccae4615584a70b4e524ed4c9460e253"

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install plissken
        run: |
          name="plissken-${PLISSKEN_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/colliery-io/plissken/releases/download/v${PLISSKEN_VERSION}/$name"
          echo "${PLISSKEN_SHA256}  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/plissken"
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/plissken"
          bin="$(find "$RUNNER_TEMP/plissken" -type f -name plissken | head -1)"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$bin" "$RUNNER_TEMP/bin/plissken"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render the API reference
        run: plissken render

      - name: Install
        working-directory: docs
        run: npm ci --no-audit --no-fund

      # A pull request builds at /, which is enough to prove the site builds.
      - name: Build site
        working-directory: docs
        run: npm run build
        env:
          DOCS_SITE: ${{ github.event_name != 'pull_request' && 'https://colliery-io.github.io' || '' }}
          DOCS_BASE: ${{ github.event_name != 'pull_request' && '/weir' || '' }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
