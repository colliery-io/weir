name: Integration

# Runs the `#[ignore]`d integration tests against the REAL compose estate —
# the CI counterpart of `angreal integration test`. The estate ([[WEIR-T-0178]])
# is Postgres (wal_level=logical), the TLS-only Postgres + Force-Encryption
# SQL Server wire gates, plain MSSQL (+seed), MySQL, MinIO (+seed), and Dex —
# so the TLS/egress gates actually gate.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  integration:
    name: Integration (compose estate)
    runs-on: ubuntu-latest
    # A hung test fails the job in an hour, not at the 6-hour runner limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1 (+ wasm target for the guest builds)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # Ephemeral TLS material for postgres-tls / mssql-tls (never committed).
      - name: Generate TLS test material
        run: bash scripts/gen-test-tls.sh

      - name: Start the integration estate
        run: docker compose --profile integration up -d --wait

      # The live connector tests (real public APIs, real keys) are #[ignore]d too, but they
      # belong to the nightly Connectors (live) workflow, never the PR path (WEIR-T-0066):
      # an upstream API hiccup must not block a merge. Skip them here by name.
      - name: Integration tests
        run: >-
          cargo test --workspace -- --ignored
          --skip manifests_run_live
          --skip snowflake_dest_writes_and_reads_back_live
          --skip snowflake_to_hubspot_retl_live
          --skip resident_does_not_block_runonce_real_executor  # WEIR-T-0206: hangs on the runner

      - name: Estate logs on failure
        if: failure()
        run: docker compose --profile integration logs --tail 50
