name: Release

# Tag v* → verify the tag matches the workspace version, build COMPLETE tarballs
# (binary + embedded UI + staged WASM connectors + vendored manifests), publish the
# container image to ghcr.io (the Helm charts' default), and cut the GitHub Release.
# [[WEIR-T-0165]]: a downloaded artifact must actually run pipelines.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  verify-version:
    name: Tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag == workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$cargo_version"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag v$tag does not match workspace version $cargo_version — run 'angreal version bump' before tagging"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: verify-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: weir-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: weir-linux-aarch64.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: weir-darwin-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1 + wasm targets (wasip2 guests, unknown for the UI)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: ${{ matrix.target }}, wasm32-wasip2, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install trunk (embedded-UI build)
        run: cargo install trunk --locked

      - name: Build the web UI
        run: trunk build --release
        working-directory: weir-ui

      - name: Stage connectors + vendored manifests
        run: |
          bash scripts/stage-connectors.sh dist-stage/connectors
          cp -R manifests dist-stage/manifests
          cp -R dest-manifests dist-stage/dest-manifests

      - name: Build release binary (embedded UI required)
        run: WEIR_REQUIRE_UI=1 cargo build --release --target ${{ matrix.target }} -p weir-cli

      - name: Package tarball
        run: |
          cp "target/${{ matrix.target }}/release/weir" dist-stage/
          cat > dist-stage/README.txt <<'EOF'
          weir — https://github.com/colliery-io/weir

          Quick start:
            export WEIR_CONNECTORS_DIR="$PWD/connectors"
            export WEIR_MANIFESTS_DIR="$PWD/manifests"
            export WEIR_DEST_MANIFESTS_DIR="$PWD/dest-manifests"
            ./weir api --port 8080   # first run on a fresh store prints the admin key ONCE

          Docs: https://github.com/colliery-io/weir/tree/main/docs
          EOF
          tar czf "${{ matrix.asset }}" -C dist-stage weir README.txt connectors manifests dest-manifests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  image:
    name: Image (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: verify-version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native-arch build per runner (no QEMU — a Rust workspace build under
      # emulation is unusable); the merge job stitches the multi-arch manifest.
      - name: Build + push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.suffix }}

  publish-image:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: image
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version + latest manifests
        run: |
          repo="ghcr.io/${{ github.repository }}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$repo:$version" -t "$repo:latest" \
            "$repo:${GITHUB_REF_NAME}-amd64" "$repo:${GITHUB_REF_NAME}-arm64"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, publish-image]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
