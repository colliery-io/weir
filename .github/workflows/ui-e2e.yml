name: UI e2e (auth)

# The embedded Leptos UI end-to-end behind auth ([[WEIR-I-0016]] / [[WEIR-I-0017]]): both auth
# doors — an API key and a full **OIDC login via Dex** — plus the sign-in gate + reverse-ETL
# onboarding. Deterministic (Dex static user; no external APIs), so it runs on push to main +
# on-demand. `angreal test e2e` brings Dex up via compose, runs the suite, and tears down.
on:
  push:
    branches: [main]
    paths:
      - "weir-ui/**"
      - "crates/weir-api/**"
      - "crates/weir-app/**"
      - "crates/weir-schema/**"
      - "e2e/**"
      - "dex.yaml"
      - "compose.yml"
      - ".github/workflows/ui-e2e.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ui-e2e:
    name: UI e2e (auth — key + OIDC/Dex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1 + wasm targets (wasip2 guests, unknown for the UI)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk (embedded-UI build)
        run: cargo install trunk --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install angreal
        run: pip install angreal

      # Builds the UI + connectors, brings up Dex via compose, starts the locked weir server
      # (key + OIDC env), seeds, runs the full Playwright suite (both doors), and tears down.
      - name: Auth UI e2e (Dex + both doors)
        run: angreal test e2e
