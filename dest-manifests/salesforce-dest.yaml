# Salesforce as a reverse-ETL **destination** (WEIR-A-0034 / WEIR-I-0007 S5) — a headline
# open-core capability: first-class reverse ETL to the Salesforce destination.
# Authored from Salesforce's public REST API docs (developer.salesforce.com), Apache-2.0.
# Runs on the shared `rest-dest` runtime — config, not a compiled connector.
#
# Contacts are upserted by an **External Id** field: PATCH the sObject addressed by the
# external id (create-or-update), so replay is idempotent. Auth is **OAuth2** — the host
# mints + refreshes the access token and injects it as a bearer (WEIR-A-0033); the client
# secret never reaches the guest. Bulk API 2.0 (async job polling) is out of scope here.
spec:
  name: salesforce-dest
base_url: https://example.my.salesforce.com
auth:
  kind: o_auth2
  token_url: "https://login.salesforce.com/services/oauth2/token"
  grant: client_credentials
  client_id_key: client_id
  client_secret_key: client_secret
objects:
  - name: contacts
    path: "/services/data/v59.0/sobjects/Contact/ExternalId__c/{{ record.ext_id }}"
    method: PATCH
    upsert_key: ext_id
    field_map:
      - [first_name, FirstName]
      - [last_name, LastName]
      - [email, Email]
