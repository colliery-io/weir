# HubSpot CRM as a reverse-ETL **destination** (WEIR-A-0034 / WEIR-I-0007 S4).
# Authored from HubSpot's public CRM v3 API docs (developers.hubspot.com/docs/api/crm),
# Apache-2.0 — no third-party connector code. Runs on the shared `rest-dest` runtime; this
# is config, not a compiled connector.
#
# Contacts are upserted by the unique `email` property: PATCH the object addressed by email
# with `idProperty=email` (create-or-update), so replay is idempotent. Auth is a private-app
# token injected **host-side** (WEIR-A-0033) — the token is never in this manifest.
spec:
  name: hubspot-dest
base_url: https://api.hubapi.com
auth:
  kind: bearer
  token_env: HUBSPOT_TOKEN
objects:
  - name: contacts
    path: "/crm/v3/objects/contacts/{{ record.email }}?idProperty=email"
    method: PATCH
    upsert_key: email
    field_map:
      - [email, email]
      - [first_name, firstname]
      - [last_name, lastname]
    body_wrap: properties
