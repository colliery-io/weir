# sops + age recipients for committed connector test secrets ([[WEIR-I-0014]]).
#
# Each developer holds their own age keypair locally. Their *public* key (the
# `age1...` string) is added to the recipient list below; anyone whose pubkey is
# listed can decrypt every file matched by the `path_regex`. The actual API keys
# live in `secrets/*.enc.json`, encrypted to all recipients and committed in
# ciphertext. See secrets/README.md for the full onboarding/rotation flow.
#
# Onboarding a new developer:
#   1. Dev runs:  age-keygen -o ~/.config/sops/age/keys.txt
#   2. Dev PRs the `age1...` public key from that file as a new line under `age:`.
#   3. A current recipient merges, then runs:  angreal secrets updatekeys
#      (= sops updatekeys secrets/*.enc.json) and commits the refreshed ciphertext.
#   4. Dev pulls; their key now decrypts every secret bundle.
#
# Rotating a secret (any recipient):  angreal secrets edit <slug>   (= sops edit)
#
# Nothing in this file is sensitive — age public keys are public by design. Treat
# it like a list of authorized SSH pubkeys.

creation_rules:
  - path_regex: secrets/.*\.enc\.json$
    # Encrypt only the secret-bearing values; structure (and metadata like
    # `__stream`, `url`, `table`) stays plaintext so diffs are reviewable.
    # Case-insensitive; matches weir's lowercase connection-config fields
    # (api_key, client_id, client_secret, refresh_token, *token, *password).
    encrypted_regex: "(?i)(key|secret|token|password|client_id)"
    age:
      # Replace this placeholder with real recipient pubkeys, one per line.
      # Format: <age1...>  # <human-readable owner>
      #   - age1qrtkst5snfmgg3aqekzwgcgpejs0r6lr2tw7xqcerkwq9q0p2qjqaay05u  # dstorey
      - age1tp700tygysjl2txjrpphsqdangadjkd4vj38a470lvad2hhvee2s7apl7w  # dstorey
      - age1g2z8ha5etylq36kuhxlm98q5ftjygqda5yr6vl36dzjkxuf0cg9qdtz6w9  # ci (SOPS_AGE_KEY repo secret; key file ~/weir-ci-sops-age-key.txt)
