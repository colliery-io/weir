# weir Postgres source/destination connector — a WASM component built for
# wasm32-wasip2: a sync Postgres wire client over fidius_guest::sockets::tcp +
# postgres-protocol (no tokio/libpq). Standalone workspace.
[workspace]

[package]
name = "weir-postgres-wasm"
version = "0.0.1-alpha"
edition = "2024"
description = "weir Postgres source/destination connector (WASM component): a sync wire client (no libpq) — full-refresh / incremental-by-cursor / CDC reads and append / overwrite / upsert writes."
license = "Apache-2.0"
repository = "https://github.com/colliery-io/weir"
homepage = "https://github.com/colliery-io/weir"
keywords = ["weir", "connector", "etl", "postgres"]
categories = ["wasm", "database"]
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
fidius-guest = "0.5.4"
fidius-macro = "0.5.4"
wit-bindgen = "0.44"
weir-connector-types = { path = "../../weir-connector-types", version = "0.0.1-alpha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Transport-agnostic Postgres wire codec + md5/SCRAM auth (pure-Rust → wasm-ok).
postgres-protocol = "0.6"
bytes = "1"
fallible-iterator = "0.2"
# Guest-side TLS ([[WEIR-A-0041]]): rustls with the pure-Rust RustCrypto provider —
# ring/aws-lc-rs need a wasi-sdk clang and don't build for wasm32-wasip2. The
# provider is alpha/unaudited (recorded trade-off; review triggers on the ADR).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-pki-types = "1.11"
webpki-roots = "0.26"

[build-dependencies]
fidius-build = "0.5.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
