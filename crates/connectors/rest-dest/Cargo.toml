# weir REST/HTTP *destination* connector — a WASM component built for wasm32-wasip2.
# The reverse-ETL analogue of `crates/connectors/rest`: one shared declarative runtime
# that interprets a destination manifest as config and upserts records to a SaaS REST API
# (WEIR-A-0034). Standalone workspace, not a member of the host weir workspace.
[workspace]

[package]
name = "weir-rest-dest-wasm"
version = "0.0.1-alpha"
edition = "2024"
description = "weir REST/HTTP destination connector (WASM component): config-driven declarative reverse-ETL — shape each record into a SaaS object JSON and POST/PATCH (upsert) over wasi:http."
license = "Apache-2.0"
repository = "https://github.com/colliery-io/weir"
homepage = "https://github.com/colliery-io/weir"
keywords = ["weir", "connector", "reverse-etl", "http"]
categories = ["wasm", "web-programming"]
readme = "README.md"

# weir ingress reads this to stage the package with the right host capabilities.
[package.metadata.weir]
capabilities = ["http"]

[lib]
crate-type = ["cdylib"]

[dependencies]
fidius-guest = "0.5.4"
fidius-macro = "0.5.4"
wit-bindgen = "0.44"
weir-connector-types = { path = "../../weir-connector-types", version = "0.0.1-alpha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
fidius-build = "0.5.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
