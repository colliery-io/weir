# weir vendored connector ([[WEIR-A-0032]] low-code).
# Authored solely from Airtable Web API's official API documentation
# (https://airtable.com/developers/web/api/introduction); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
type: DeclarativeSource

streams:
  - type: DeclarativeStream
    name: records
    primary_key: id

    retriever:
      type: SimpleRetriever

      requester:
        type: HttpRequester
        url_base: "https://api.airtable.com/v0"
        # Both path segments are user-supplied configuration — see Open Questions #1
        path: "/{{ config['base_id'] }}/{{ config['table_name'] }}"
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_key'] }}"

      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["records"]

      # Paginator OMITTED — Airtable uses an opaque string offset cursor.
      # Neither PageIncrement nor OffsetIncrement can model it. See Open Questions #2.

    # incremental_sync OMITTED — no time-based query parameter exists. See Open Questions #3.

    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: string
          createdTime:
            type: string
            format: date-time
          fields:
            # Shape is entirely table-specific; unknowable at connector-build time.
            type: object
          commentCount:
            type: ["null", "integer"]
