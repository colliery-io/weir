# weir vendored connector ([[WEIR-A-0032]] low-code).
# Authored solely from HubSpot CRM's official API documentation
# (https://developers.hubspot.com/docs/api/crm/contacts); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
type: DeclarativeSource

streams:
  # ─── contacts ───────────────────────────────────────────────────────────────
  - type: DeclarativeStream
    name: contacts
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.hubapi.com"
        path: "/crm/v3/objects/contacts"
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['access_token'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]       # ⚠ unconfirmed — see Open questions
      # Paginator omitted: HubSpot uses opaque-cursor pagination (after=<token>),
      # which cannot be expressed as PageIncrement or OffsetIncrement.
      # See Open questions #1.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: ["null", "string"]
          properties:
            type: ["null", "object"]

  # ─── companies ──────────────────────────────────────────────────────────────
  - type: DeclarativeStream
    name: companies
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.hubapi.com"
        path: "/crm/v3/objects/companies"   # ⚠ inferred — see Open questions #2
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['access_token'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]            # ⚠ unconfirmed — see Open questions #3
      # Paginator omitted: same cursor-pagination caveat as contacts.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: ["null", "string"]
          properties:
            type: ["null", "object"]

  # ─── deals ──────────────────────────────────────────────────────────────────
  - type: DeclarativeStream
    name: deals
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.hubapi.com"
        path: "/crm/v3/objects/deals"       # ⚠ inferred — see Open questions #2
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['access_token'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]            # ⚠ unconfirmed — see Open questions #3
      # Paginator omitted: same cursor-pagination caveat as contacts.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: ["null", "string"]
          properties:
            type: ["null", "object"]
