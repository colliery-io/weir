# weir vendored connector ([[WEIR-A-0032]] low-code).
# Authored solely from Notion API's official API documentation
# (https://developers.notion.com/reference); no third-party connector implementation was consulted.
# License: Apache-2.0 (this repo).
# IMPORTANT — READ BEFORE USING
#
# Three structural mismatches between the Notion API and the target schema
# make it impossible to produce a fully functional manifest within the schema's
# constraints. All three are documented in Section C (Open questions / assumptions).
#
# 1. Both streams use POST /v1/search, not GET. The target schema has no http_method field.
# 2. Pagination cursor AND stream filter must be in the POST request body;
#    the target schema's RequestOption only reaches query-string or header params.
# 3. Notion uses opaque cursor pagination (start_cursor → next_cursor),
#    which the target schema cannot express (only PageIncrement / OffsetIncrement).
#
# The manifest below faithfully expresses everything the schema CAN represent:
# auth, url_base, path, record_selector, primary_key, and field schemas.
# Paginator and incremental_sync blocks are intentionally OMITTED because they
# cannot be expressed correctly — wrong scaffolding is worse than none.

type: DeclarativeSource

streams:

  # ── Stream 1: databases ─────────────────────────────────────────────────────
  # Source endpoint: POST /v1/search
  #   body: { "filter": { "property": "object", "value": "data_source" },
  #           "page_size": 100,
  #           "start_cursor": "<cursor from prior response>" }
  # Records live in the response's "results" array.
  # Cursor pagination: see Open questions #1–3.
  - type: DeclarativeStream
    name: databases
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.notion.com"
        path: "/v1/search"
        # http_method: POST   ← not in target schema; noted in Open questions #1
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_token'] }}"
        # Notion-Version header is required on every request (e.g. "2022-06-28").
        # The target schema has no place for static custom headers; see Open questions #4.
        # Stream filter { "filter": { "property": "object", "value": "data_source" } }
        # must be in the POST body; not expressible here; see Open questions #2.
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]   # API returns { "results": [...], "has_more": bool, "next_cursor": str }
      # paginator intentionally omitted — cursor pagination via POST body cannot be
      # expressed in the target schema; see Open questions #1–3.
    # incremental_sync intentionally omitted — the search API has no time-range
    # filter parameter; see Open questions #5.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          object:
            type: ["null", "string"]          # always "database"
          id:
            type: string                       # UUID; primary key
          created_time:
            type: string
            format: date-time                  # ISO 8601
          created_by:
            type: ["null", "object"]           # Partial User object
          last_edited_time:
            type: string
            format: date-time                  # ISO 8601
          last_edited_by:
            type: ["null", "object"]           # Partial User object
          title:
            type: ["null", "array"]            # array of rich-text objects
          description:
            type: ["null", "array"]            # array of rich-text objects
          icon:
            type: ["null", "object"]           # Emoji / Icon / File object
          cover:
            type: ["null", "object"]           # File object
          parent:
            type: ["null", "object"]           # parent reference
          url:
            type: ["null", "string"]
          archived:
            type: ["null", "boolean"]          # deprecated; use in_trash
          in_trash:
            type: ["null", "boolean"]
          is_inline:
            type: ["null", "boolean"]
          public_url:
            type: ["null", "string"]
          data_sources:
            type: ["null", "array"]            # list of child data-source refs

  # ── Stream 2: pages ─────────────────────────────────────────────────────────
  # Source endpoint: POST /v1/search
  #   body: { "filter": { "property": "object", "value": "page" },
  #           "page_size": 100,
  #           "start_cursor": "<cursor from prior response>" }
  # Records live in the response's "results" array.
  # Cursor pagination: see Open questions #1–3.
  - type: DeclarativeStream
    name: pages
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "https://api.notion.com"
        path: "/v1/search"
        # http_method: POST   ← not in target schema; noted in Open questions #1
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_token'] }}"
        # Notion-Version header required; not expressible in target schema.
        # Stream filter { "filter": { "property": "object", "value": "page" } }
        # must be in the POST body; not expressible here; see Open questions #2.
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: ["results"]
      # paginator intentionally omitted; see Open questions #1–3.
    # incremental_sync intentionally omitted; see Open questions #5.
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          object:
            type: ["null", "string"]          # always "page"
          id:
            type: string                       # UUIDv4; primary key
          created_time:
            type: string
            format: date-time                  # ISO 8601
          created_by:
            type: ["null", "object"]           # Partial User object
          last_edited_time:
            type: string
            format: date-time                  # ISO 8601
          last_edited_by:
            type: ["null", "object"]           # Partial User object
          archived:
            type: ["null", "boolean"]          # deprecated; use in_trash
          in_trash:
            type: ["null", "boolean"]
          icon:
            type: ["null", "object"]           # Emoji / Icon / File object
          cover:
            type: ["null", "object"]           # File object
          properties:
            type: ["null", "object"]           # property-value map; shape varies by parent schema
          parent:
            type: ["null", "object"]           # parent reference
          url:
            type: ["null", "string"]
          public_url:
            type: ["null", "string"]
